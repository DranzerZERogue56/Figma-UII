<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Futuristic UI Mock-ups</title>
<link rel="stylesheet" href="styles/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; align-items: stretch; gap: 2px; padding: 0 10px; background: #050505; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; }
  .brand { display: flex; align-items: center; padding: 0 18px 0 6px; font-family: var(--font-display); font-weight: 700; letter-spacing: .12em; color: var(--red); white-space: nowrap; }
  button {
    font: inherit; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
    background: none; color: var(--text-dim); border: 0; border-bottom: 2px solid transparent;
    padding: 14px 16px 12px; cursor: pointer;
  }
  button:hover { color: var(--text); }
  button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--red); background: linear-gradient(0deg, rgba(255,70,87,.14), transparent); }
  button .n { color: var(--red); margin-right: 6px; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
<nav role="tablist">
  <span class="brand">FUTURISTIC UI</span>
</nav>
<iframe id="view" title="Mock-up"></iframe>
<script>
  // One tab per frame of the Figma file, in the same order.
  const tabs = [
    ["broadcast", "Broadcast"],
    ["layouts", "Layouts"],
    ["circular", "Circular"],
    ["download", "Download"],
    ["icons", "Icons"],
    ["launch", "Rocket Launch"],
    ["charts", "Charts"],
    ["laptop", "Laptop"],
  ];
  const nav = document.querySelector("nav"), view = document.getElementById("view");
  const buttons = tabs.map(([id, name], i) => {
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.innerHTML = `<span class="n">0${i + 1}</span>${name}`;
    // clicking the open tab again reloads it (handy for getting back from a full-size layout)
    b.onclick = () => (location.hash.slice(1) === id ? open(id) : (location.hash = id));
    nav.appendChild(b);
    return b;
  });
  function open(id) {
    const i = Math.max(0, tabs.findIndex((t) => t[0] === id));
    buttons.forEach((b, j) => b.setAttribute("aria-selected", i === j));
    view.src = `screens/${tabs[i][0]}.html`;
  }
  // Number keys 1-8 switch tabs too.
  addEventListener("keydown", (e) => { const n = +e.key; if (n >= 1 && n <= tabs.length) buttons[n - 1].click(); });
  addEventListener("message", (e) => { if (e.origin === location.origin && buttons[e.data?.tab - 1]) buttons[e.data.tab - 1].click(); });
  addEventListener("hashchange", () => open(location.hash.slice(1)));
  open(location.hash.slice(1));
</script>
</body>
</html>
